<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wettrunde Prototyp</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
body { margin: 0; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* Layout: eine Handy-Spalte (max. 440px), schwarze Flaeche, Neongruen nur fuer Aktionen, eigenen Stand und offene Wetten. */
:root {
  color-scheme: dark;
  --bg: #050505; --s1: #0F110F; --s2: #191C19; --line: #272B27;
  --fg: #F3F5F2; --mut: #8E968D;
  --neon: #39FF14; --neon-dim: rgba(57,255,20,.12);
  --red: #FF5A5A; --red-dim: rgba(255,90,90,.12);
  --amber: #FFC53D; --amber-dim: rgba(255,197,61,.12);
  --display: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { background: #000; }
body { color: var(--fg); font: 400 15px/1.5 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.phone { max-width: 440px; margin: 0 auto; min-height: 100vh; background: var(--bg); border-inline: 1px solid var(--line); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 8px; min-height: 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top h1 { font: 600 18px/1.2 var(--display); margin: 0; min-width: 0; overflow-wrap: anywhere; }
.back { width: 40px; height: 40px; margin-left: -8px; border: 0; background: none; color: var(--neon); font: 600 28px/1 var(--display); cursor: pointer; border-radius: 10px; }
.wrap { display: flex; flex-direction: column; gap: 16px; padding-block: 16px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font: 700 30px/1 var(--display); letter-spacing: -.02em; margin: 8px 0 0; }
.brand b { color: var(--neon); font-weight: 700; }
.mut { color: var(--mut); } .small { font-size: 13px; }
h2 { font: 600 13px/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--mut); margin: 8px 0 0; }
.card { background: var(--s1); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
button.card { text-align: left; color: inherit; font: inherit; cursor: pointer; width: 100%; }
button.card:active { background: var(--s2); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; }
.row > :first-child { min-width: 0; overflow-wrap: anywhere; }
.title { font: 600 16px/1.3 var(--display); }
.num { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.pos { color: var(--neon); } .neg { color: var(--red); }
.hero { background: var(--s1); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 2px; }
.hero .big { font: 700 44px/1.05 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.btn { min-height: 48px; border-radius: 999px; border: 1px solid var(--line); background: var(--s2); color: var(--fg); font: 600 15px/1 var(--body); padding: 0 18px; cursor: pointer; flex: 1; }
.btn.pri { background: var(--neon); border-color: var(--neon); color: #041200; }
.btn.danger { color: var(--red); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn.sm { min-height: 36px; font-size: 13px; padding: 0 14px; flex: none; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
:is(button, input, select, textarea):focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; }
.hint { border: 1px solid var(--amber); background: var(--amber-dim); color: var(--amber); border-radius: 14px; padding: 12px 14px; font-size: 14px; }
.tabs { display: flex; background: var(--s1); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.tabs button { flex: 1; min-height: 38px; border: 0; border-radius: 999px; background: none; color: var(--mut); font: 600 14px/1 var(--body); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--neon); color: #041200; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: none; color: var(--fg); font: 500 14px/1 var(--body); cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--neon); color: var(--neon); background: var(--neon-dim); }
.pill { font: 600 11px/1 var(--body); letter-spacing: .05em; text-transform: uppercase; padding: 5px 8px; border-radius: 999px; white-space: nowrap; }
.pill.open { color: var(--neon); background: var(--neon-dim); }
.pill.wait { color: var(--amber); background: var(--amber-dim); }
.pill.bad { color: var(--red); background: var(--red-dim); }
.pill.done { color: var(--fg); background: var(--s2); }
.tag { font: 600 11px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--mut); }
label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--mut); min-width: 0; }
input, select, textarea { font: 400 16px/1.3 var(--body); color: var(--fg); background: var(--s1); border: 1px solid var(--line); border-radius: 12px; padding: 12px; width: 100%; box-sizing: border-box; min-width: 0; }
textarea { resize: vertical; min-height: 72px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bar { height: 6px; border-radius: 999px; background: var(--s2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--neon); border-radius: 999px; }
.opt { display: flex; flex-direction: column; gap: 6px; padding: 12px 0; border-top: 1px solid var(--line); }
.opt:first-child { border-top: 0; padding-top: 0; }
.opt.win .title { color: var(--neon); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--mut); } .kv dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
.demo { border: 1px dashed var(--mut); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.list { display: flex; flex-direction: column; }
.list .row { padding: 10px 0; border-top: 1px solid var(--line); }
.list .row:first-child { border-top: 0; }
.code { font: 600 18px/1 var(--display); letter-spacing: .1em; color: var(--neon); }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 20; max-width: min(400px, calc(100vw - 32px));
  background: var(--fg); color: #000; font: 600 14px/1.3 var(--body); padding: 12px 16px; border-radius: 14px; }
.linkbtn { background: none; border: 0; color: var(--mut); font: 500 13px/1 var(--body); text-decoration: underline; cursor: pointer; padding: 12px 0; align-self: center; }
</style>
</head>
<body>
<div class="phone"><div id="app"></div></div>
<div id="toast" role="status" hidden></div>

<script>
const LS = 'wettrunde-draft-v1';
const POOL = ['Anna', 'Ben', 'Clara', 'Jonas', 'Mia', 'Leon'];
const EVENTS = [
  { name: 'Bayern – Dortmund', when: 'Sa, 18:30', opts: ['Bayern', 'Unentschieden', 'Dortmund'] },
  { name: 'Leipzig – Leverkusen', when: 'So, 15:30', opts: ['Leipzig', 'Unentschieden', 'Leverkusen'] },
  { name: 'Darts-WM Finale', when: '3. Jan, 21:00', opts: ['Favorit gewinnt', 'Außenseiter gewinnt'] }
];
const STATUS = {
  open: ['Offen', 'open'], locked: ['Gesperrt', 'wait'], resolving: ['In Auflösung', 'wait'], disputed: ['Strittig', 'bad'],
  resolved: ['Aufgelöst', 'done'], void: ['Ungültig', 'bad'], infeasible: ['Nicht durchführbar', 'bad']
};

function seed() {
  const d = h => new Date(Date.now() + h * 3600e3).toISOString();
  return {
    users: { me: 'Du', anna: 'Anna', ben: 'Ben', clara: 'Clara' },
    groups: [
      { id: 'g1', name: 'WG Südstadt', desc: 'Alles, worauf man in einer WG wetten kann', code: 'SUED-4821', admin: 'me',
        members: ['me', 'anna', 'ben', 'clara'], bal: { me: 50, anna: 100, ben: 0, clara: -150 },
        ledger: [{ t: 'Wette „Schafft Ben den Halbmarathon unter 2 Stunden?“ aufgelöst', d: { anna: 100, me: 50, clara: -150 } }],
        pay: [],
        bets: [
          { id: 'b1', type: 'real', name: 'Kocht Ben bis Sonntag für alle?', desc: 'Zählt nur, wenn alle vier am Tisch sitzen.', opts: ['Ja', 'Nein'], min: 10, max: 100, deadline: d(96), creator: 'ben', status: 'open',
            entries: [{ u: 'ben', o: 0, s: 50 }, { u: 'anna', o: 1, s: 30 }] },
          { id: 'b2', type: 'event', name: 'Bayern – Dortmund: Wer gewinnt?', desc: '', opts: ['Bayern', 'Unentschieden', 'Dortmund'], min: 10, max: 50, event: 'Bayern – Dortmund · Sa, 18:30', creator: 'me', status: 'open',
            entries: [{ u: 'me', o: 0, s: 40 }, { u: 'clara', o: 2, s: 40 }] },
          { id: 'b3', type: 'real', name: 'Schafft Anna 10 Klimmzüge am Stück?', desc: 'Video als Beweis.', opts: ['Ja', 'Nein'], min: 10, max: 50, deadline: d(-2), creator: 'anna', status: 'resolving', proposed: 0,
            entries: [{ u: 'anna', o: 0, s: 20 }, { u: 'me', o: 1, s: 20 }, { u: 'ben', o: 1, s: 10 }] },
          { id: 'b0', type: 'real', name: 'Schafft Ben den Halbmarathon unter 2 Stunden?', desc: '', opts: ['Ja', 'Nein'], min: 10, max: 200, deadline: d(-200), creator: 'clara', status: 'resolved', result: 0,
            entries: [{ u: 'anna', o: 0, s: 100 }, { u: 'me', o: 0, s: 50 }, { u: 'clara', o: 1, s: 150 }], deltas: { anna: 100, me: 50, clara: -150 } }
        ] },
      { id: 'g2', name: 'Fußballrunde', desc: '', code: 'FUSS-1907', admin: 'me', members: ['me'], bal: { me: 0 }, ledger: [], pay: [], bets: [] }
    ]
  };
}

let db;
try { db = JSON.parse(localStorage.getItem(LS)); } catch (e) { db = null; }
if (!db || !db.groups) db = seed();
const ui = { nav: [{ v: 'home' }], tab: 'bets', filter: 'all', draft: null, gdraft: { name: '', desc: '' }, join: { o: null, s: '' } };
function save() { try { localStorage.setItem(LS, JSON.stringify(db)); } catch (e) {} }

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = n => Math.abs(n).toLocaleString('de-DE');
const sg = n => (n > 0 ? '+' : n < 0 ? '−' : '') + nf(n);
const cls = n => n > 0 ? 'pos' : n < 0 ? 'neg' : '';
const uid = () => Math.random().toString(36).slice(2, 9);
const nm = u => db.users[u] || u;
const cur = () => ui.nav[ui.nav.length - 1];
const grp = () => db.groups.find(g => g.id === cur().g);
const bet = () => { const g = grp(); return g && g.bets.find(b => b.id === cur().b); };
const pot = b => b.entries.reduce((a, e) => a + e.s, 0);
const mine = b => b.entries.find(e => e.u === 'me');
const fdate = iso => new Date(iso).toLocaleString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const localInput = d => { const p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()); };

let toastTimer;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2800); }

/* ---------- Logik ---------- */
function payout(b, w) {
  const p = pot(b), win = b.entries.filter(e => e.o === w), ws = win.reduce((a, e) => a + e.s, 0), d = {};
  if (!ws) return null;
  b.entries.forEach(e => { d[e.u] = -e.s; });
  let rest = p;
  win.forEach(e => { const sh = Math.floor(p * e.s / ws); d[e.u] += sh; rest -= sh; });
  if (rest) d[win.slice().sort((a, c) => c.s - a.s)[0].u] += rest;
  return d;
}
function resolve(g, b, w) {
  const d = payout(b, w);
  b.result = w;
  if (!d) { b.status = 'void'; toast('Niemand hat auf dieses Ergebnis gesetzt. Wette ungültig, keine Buchung.'); return; }
  b.status = 'resolved'; b.deltas = d;
  Object.keys(d).forEach(u => { g.bal[u] = (g.bal[u] || 0) + d[u]; });
  g.ledger.push({ t: 'Wette „' + b.name + '“ aufgelöst', d });
  toast('Wette aufgelöst, Salden gebucht.');
}
function lock(b) {
  const sides = new Set(b.entries.map(e => e.o));
  if (sides.size < 2) { b.status = 'infeasible'; toast('Kein Gegenspieler. Wette nicht durchführbar und geschlossen.'); }
  else { b.status = 'locked'; toast('Annahmeschluss. Wette gesperrt.'); }
}
function suggestions(g) {
  const bal = Object.assign({}, g.bal);
  g.pay.forEach(p => { bal[p.from] += p.amt; bal[p.to] -= p.amt; });
  const deb = g.members.filter(u => bal[u] < 0).map(u => ({ u, a: -bal[u] })).sort((a, b) => b.a - a.a);
  const cre = g.members.filter(u => bal[u] > 0).map(u => ({ u, a: bal[u] })).sort((a, b) => b.a - a.a);
  const out = []; let i = 0, j = 0;
  while (i < deb.length && j < cre.length) {
    const amt = Math.min(deb[i].a, cre[j].a);
    out.push({ from: deb[i].u, to: cre[j].u, amt });
    deb[i].a -= amt; cre[j].a -= amt;
    if (!deb[i].a) i++; if (!cre[j].a) j++;
  }
  return out;
}

/* ---------- Ansichten ---------- */
const head = (title, back) => '<header class="top">' + (back ? '<button class="back" data-a="back" aria-label="Zurück">‹</button>' : '') + '<h1>' + esc(title) + '</h1></header>';
const pill = s => '<span class="pill ' + STATUS[s][1] + '">' + STATUS[s][0] + '</span>';

function vHome() {
  const cards = db.groups.map(g => {
    const open = g.bets.filter(b => b.status === 'open').length, bal = g.bal.me || 0;
    return '<button class="card" data-a="go" data-v="group" data-g="' + g.id + '"><div class="row"><span class="title">' + esc(g.name) + '</span><span class="num ' + cls(bal) + '">' + sg(bal) + '</span></div>' +
      '<div class="row small mut"><span>' + g.members.length + (g.members.length === 1 ? ' Mitglied' : ' Mitglieder') + ' · ' + open + ' offene ' + (open === 1 ? 'Wette' : 'Wetten') + '</span><span>Credits</span></div></button>';
  }).join('');
  return '<div class="wrap"><p class="brand">WETT<b>RUNDE</b></p><p class="mut">Wetten unter Freunden. Abgerechnet wird in Credits, ausgeglichen wird am Ende.</p>' +
    '<h2>Deine Gruppen</h2>' + cards +
    '<div class="btns"><button class="btn pri" data-a="go" data-v="newGroup">Gruppe erstellen</button></div>' +
    '<p class="small mut">Prototyp mit Beispieldaten. Anna, Ben und Clara sind erfunden, es gibt noch kein Konto und keinen Server.</p>' +
    '<button class="linkbtn" data-a="reset">Beispieldaten zurücksetzen</button></div>';
}

function vNewGroup() {
  return head('Gruppe erstellen', true) + '<div class="wrap">' +
    '<label>Gruppenname<input id="gd-name" data-gd="name" value="' + esc(ui.gdraft.name) + '" maxlength="40" placeholder="z. B. Stammtisch"></label>' +
    '<label>Beschreibung (optional)<textarea id="gd-desc" data-gd="desc" maxlength="140">' + esc(ui.gdraft.desc) + '</textarea></label>' +
    '<div class="hint">Du kannst die Gruppe allein erstellen. Wetten sind aber erst ab 2 Mitgliedern möglich. Bis dahin kannst du nur Mitglieder einladen und die Gruppe verwalten.</div>' +
    '<div class="btns"><button class="btn pri" data-a="createGroup">Gruppe erstellen</button></div></div>';
}

function betCard(b) {
  const m = mine(b);
  return '<button class="card" data-a="go" data-v="bet" data-g="' + cur().g + '" data-b="' + b.id + '"><div class="row"><span class="tag">' + (b.type === 'event' ? 'Event' : 'Reallife') + '</span>' + pill(b.status) + '</div>' +
    '<span class="title">' + esc(b.name) + '</span>' +
    '<div class="row small mut"><span>' + (m ? 'Du: ' + esc(b.opts[m.o]) + ' · ' + nf(m.s) : 'Du bist nicht dabei') + '</span><span class="num">Topf ' + nf(pot(b)) + '</span></div></button>';
}

function vGroup() {
  const g = grp(), solo = g.members.length < 2, bal = g.bal.me || 0;
  let body = '';
  if (ui.tab === 'bets') {
    const fs = { all: 'Alle', mine: 'Meine', done: 'Beendet' };
    const act = b => ['open', 'locked', 'resolving', 'disputed'].includes(b.status);
    const list = g.bets.filter(b => ui.filter === 'mine' ? mine(b) && act(b) : ui.filter === 'done' ? !act(b) : true)
      .slice().sort((a, b) => (act(b) ? 1 : 0) - (act(a) ? 1 : 0));
    body = '<div class="chips">' + Object.keys(fs).map(k => '<button class="chip" data-a="filter" data-f="' + k + '" aria-pressed="' + (ui.filter === k) + '">' + fs[k] + '</button>').join('') + '</div>' +
      (list.length ? list.map(betCard).join('') : '<p class="mut">' + (solo ? 'Noch keine Wetten. Lade zuerst jemanden ein.' : 'Hier ist noch nichts. Erstelle die erste Wette.') + '</p>');
  } else if (ui.tab === 'bal') {
    body = '<div class="card list">' + g.members.map(u => '<div class="row"><span>' + esc(nm(u)) + '</span><span class="num ' + cls(g.bal[u] || 0) + '">' + sg(g.bal[u] || 0) + '</span></div>').join('') + '</div>' +
      '<h2>Kontoverlauf</h2>' + (g.ledger.length ? g.ledger.slice().reverse().map(l => '<div class="card"><span>' + esc(l.t) + '</span><div class="chips small">' +
        Object.keys(l.d).map(u => '<span class="num ' + cls(l.d[u]) + '">' + esc(nm(u)) + ' ' + sg(l.d[u]) + '</span>').join('') + '</div></div>').join('') : '<p class="mut">Noch keine Buchungen.</p>');
  } else {
    body = '<div class="card list">' + g.members.map(u => '<div class="row"><span>' + esc(nm(u)) + '</span>' + (u === g.admin ? '<span class="tag">Admin</span>' : '') + '</div>').join('') + '</div>' +
      '<div class="card"><span class="small mut">Einladungscode</span><div class="row"><span class="code" id="code">' + esc(g.code) + '</span><button class="btn sm" data-a="copy">Kopieren</button></div></div>' +
      '<div class="demo"><span class="tag">Demo</span><span class="small mut">Im Prototyp gibt es keine echten Einladungen. So simulierst du einen Beitritt.</span><div class="btns"><button class="btn" data-a="addMember">Beispiel-Mitglied hinzufügen</button></div></div>';
  }
  const tabs = { bets: 'Wetten', bal: 'Salden', mem: 'Mitglieder' };
  return head(g.name, true) + '<div class="wrap">' +
    '<div class="hero"><span class="small mut">Dein Saldo in dieser Gruppe</span><span class="big ' + cls(bal) + '">' + sg(bal) + '</span><span class="small mut">Credits</span></div>' +
    (solo ? '<div class="hint">Du bist allein in dieser Gruppe. Wetten sind erst ab 2 Mitgliedern möglich. Lade unter „Mitglieder“ jemanden ein.</div>' : '') +
    '<div class="btns"><button class="btn pri" data-a="newBet"' + (solo ? ' disabled' : '') + '>Wette erstellen</button><button class="btn" data-a="go" data-v="settle" data-g="' + g.id + '"' + (solo ? ' disabled' : '') + '>Ausgleichen</button></div>' +
    '<div class="tabs" role="tablist">' + Object.keys(tabs).map(k => '<button role="tab" data-a="tab" data-t="' + k + '" aria-selected="' + (ui.tab === k) + '">' + tabs[k] + '</button>').join('') + '</div>' + body + '</div>';
}

function vNewBet() {
  const d = ui.draft, opts = d.type === 'event' ? EVENTS[d.ev].opts : [d.o1 || 'Option 1', d.o2 || 'Option 2'];
  if (d.side >= opts.length) d.side = 0;
  const typeBtn = (k, t) => '<button role="tab" data-a="type" data-t="' + k + '" aria-selected="' + (d.type === k) + '">' + t + '</button>';
  const specific = d.type === 'event'
    ? '<label>Event auswählen<select id="d-ev" data-d="ev">' + EVENTS.map((e, i) => '<option value="' + i + '"' + (i === +d.ev ? ' selected' : '') + '>' + esc(e.name + ' · ' + e.when) + '</option>').join('') + '</select></label>' +
      '<p class="small mut">Annahmeschluss ist der Eventstart. Das Ergebnis kommt danach automatisch. Die Events hier sind Beispiele.</p>'
    : '<div class="two"><label>Ausgang 1<input id="d-o1" data-d="o1" value="' + esc(d.o1) + '" maxlength="24"></label><label>Ausgang 2<input id="d-o2" data-d="o2" value="' + esc(d.o2) + '" maxlength="24"></label></div>' +
      '<label>Deadline<input id="d-dl" type="datetime-local" data-d="deadline" value="' + esc(d.deadline) + '"></label>' +
      '<p class="small mut">Annahmeschluss ist 24 Stunden vor der Deadline. Danach meldest du das Ergebnis, die Gruppe bestätigt.</p>';
  return head('Wette erstellen', true) + '<div class="wrap">' +
    '<div class="tabs" role="tablist">' + typeBtn('real', 'Reallife-Wette') + typeBtn('event', 'Event-Wette') + '</div>' +
    '<label>Name der Wette<input id="d-name" data-d="name" value="' + esc(d.name) + '" maxlength="80" placeholder="Worum geht es?"></label>' +
    '<label>Beschreibung (optional)<textarea id="d-desc" data-d="desc" maxlength="200" placeholder="Regeln, Beweis, Sonderfälle">' + esc(d.desc) + '</textarea></label>' +
    specific +
    '<div class="two"><label>Mindesteinsatz<input id="d-min" type="number" inputmode="numeric" min="1" data-d="min" value="' + esc(d.min) + '"></label><label>Höchsteinsatz<input id="d-max" type="number" inputmode="numeric" min="1" data-d="max" value="' + esc(d.max) + '"></label></div>' +
    '<h2>Deine Seite</h2><div class="chips">' + opts.map((o, i) => '<button class="chip" data-a="dside" data-i="' + i + '" aria-pressed="' + (d.side === i) + '">' + esc(o) + '</button>').join('') + '</div>' +
    '<label>Dein Einsatz in Credits<input id="d-stake" type="number" inputmode="numeric" min="1" data-d="stake" value="' + esc(d.stake) + '"></label>' +
    '<div class="btns"><button class="btn pri" data-a="createBet">Wette veröffentlichen</button></div></div>';
}

function vBet() {
  const g = grp(), b = bet(), p = pot(b), m = mine(b), iAmCreator = b.creator === 'me';
  const when = b.type === 'event'
    ? '<dt>Event</dt><dd>' + esc(b.event) + '</dd><dt>Annahmeschluss</dt><dd>Eventstart</dd>'
    : '<dt>Deadline</dt><dd>' + esc(fdate(b.deadline)) + '</dd><dt>Annahmeschluss</dt><dd>' + esc(fdate(new Date(new Date(b.deadline).getTime() - 864e5).toISOString())) + '</dd>';
  const optsHtml = b.opts.map((o, i) => {
    const es = b.entries.filter(e => e.o === i), sum = es.reduce((a, e) => a + e.s, 0);
    return '<div class="opt' + (b.status === 'resolved' && b.result === i ? ' win' : '') + '"><div class="row"><span class="title">' + esc(o) + (b.status === 'resolved' && b.result === i ? ' ✓' : '') + '</span><span class="num">' + nf(sum) + '</span></div>' +
      '<div class="bar"><i style="width:' + (p ? Math.round(sum / p * 100) : 0) + '%"></i></div>' +
      '<span class="small mut">' + (es.length ? es.map(e => esc(nm(e.u)) + ' ' + nf(e.s)).join(' · ') : 'noch niemand') + '</span></div>';
  }).join('');
  let pos = '';
  if (m && ['open', 'locked', 'resolving', 'disputed'].includes(b.status)) {
    const d = payout(b, m.o);
    pos = '<div class="card"><div class="row"><span>Du setzt ' + nf(m.s) + ' auf „' + esc(b.opts[m.o]) + '“</span><span class="num pos">' + (d ? sg(d.me) : '') + '</span></div><span class="small mut">Möglicher Gewinn beim aktuellen Topf. Dein Saldo ändert sich erst bei der Auflösung.</span></div>';
  }
  if (b.status === 'resolved') {
    pos = '<div class="card"><span class="small mut">Ergebnis: ' + esc(b.opts[b.result]) + '</span><div class="list">' + Object.keys(b.deltas).map(u => '<div class="row"><span>' + esc(nm(u)) + '</span><span class="num ' + cls(b.deltas[u]) + '">' + sg(b.deltas[u]) + '</span></div>').join('') + '</div></div>';
  }
  if (b.status === 'infeasible') pos = '<div class="hint">Bis zum Annahmeschluss gab es keinen Gegenspieler. Die Wette wurde als nicht durchführbar markiert und geschlossen. Es wurde nichts gebucht.</div>';
  if (b.status === 'void') pos = '<div class="hint">Diese Wette ist ungültig. Es wurde nichts gebucht.</div>';

  const pick = (action, label) => '<span class="small mut">' + label + '</span><div class="chips">' + b.opts.map((o, i) => '<button class="chip" data-a="' + action + '" data-i="' + i + '">' + esc(o) + '</button>').join('') + '</div>';
  let act = '', demo = '';
  if (b.status === 'open') {
    if (!m) {
      act = '<h2>Beitreten</h2><div class="chips">' + b.opts.map((o, i) => '<button class="chip" data-a="pick" data-i="' + i + '" aria-pressed="' + (ui.join.o === i) + '">' + esc(o) + '</button>').join('') + '</div>' +
        '<label>Dein Einsatz (' + nf(b.min) + ' bis ' + nf(b.max) + ' Credits)<input id="j-stake" type="number" inputmode="numeric" data-j="s" value="' + esc(ui.join.s) + '" min="' + b.min + '" max="' + b.max + '"></label>' +
        '<div class="btns"><button class="btn pri" data-a="join">Beitreten</button></div>';
    } else if (iAmCreator) {
      act = '<div class="btns"><button class="btn danger" data-a="cancel">Wette stornieren</button></div><p class="small mut">Stornieren geht nur, solange die Wette offen ist. Ändern lässt sie sich nach dem ersten Beitritt nicht mehr.</p>';
    } else {
      act = '<div class="btns"><button class="btn danger" data-a="withdraw">Einsatz zurückziehen</button></div>';
    }
    demo = '<span class="small mut">Im Prototyp läuft keine Zeit und es gibt keine anderen Nutzer.</span><div class="btns"><button class="btn" data-a="demoJoin">Beispiel-Beitritt</button><button class="btn" data-a="lock">Annahmeschluss jetzt</button></div>';
  } else if (b.status === 'locked') {
    if (b.type === 'event') demo = pick('result', 'Ergebnis der Sport-API simulieren:');
    else if (iAmCreator) act = '<h2>Ergebnis melden</h2><div class="card">' + pick('propose', 'Was ist passiert?') + '</div>';
    else demo = pick('propose', esc(nm(b.creator)) + ' meldet das Ergebnis:');
  } else if (b.status === 'resolving') {
    const mineProp = iAmCreator;
    act = '<div class="card"><span>' + esc(nm(b.creator)) + (mineProp ? ' hast' : ' hat') + ' „' + esc(b.opts[b.proposed]) + '“ als Ergebnis gemeldet.</span>' +
      (mineProp ? '<span class="small mut">Die anderen Teilnehmer müssen bestätigen. Ohne Reaktion gilt es nach 48 Stunden.</span>' :
        '<div class="btns"><button class="btn pri" data-a="confirm">Bestätigen</button><button class="btn danger" data-a="dispute">Einspruch</button></div>') + '</div>';
    if (mineProp) demo = '<div class="btns"><button class="btn" data-a="confirm">Gruppe bestätigt</button><button class="btn" data-a="dispute">Jemand legt Einspruch ein</button></div>';
  } else if (b.status === 'disputed') {
    act = '<div class="hint">Gegen das Ergebnis wurde Einspruch eingelegt. Alle Teilnehmer stimmen ab, die Mehrheit entscheidet.</div>';
    demo = pick('result', 'Abstimmung simulieren. Mehrheit für:') + '<div class="btns"><button class="btn" data-a="nomajority">Keine Mehrheit</button></div>';
  }
  return head('Wett-Detail', true) + '<div class="wrap">' +
    '<div class="row"><span class="tag">' + (b.type === 'event' ? 'Event-Wette' : 'Reallife-Wette') + ' · von ' + esc(nm(b.creator)) + '</span>' + pill(b.status) + '</div>' +
    '<p class="brand" style="font-size:24px;line-height:1.2;margin:0">' + esc(b.name) + '</p>' + (b.desc ? '<p class="mut">' + esc(b.desc) + '</p>' : '') +
    '<div class="hero"><span class="small mut">Topf</span><span class="big">' + nf(p) + '</span><span class="small mut">Credits · Einsatz ' + nf(b.min) + ' bis ' + nf(b.max) + '</span></div>' +
    '<div class="card">' + optsHtml + '</div>' + pos +
    '<div class="card"><dl class="kv" style="margin:0">' + when + '</dl></div>' + act +
    (demo ? '<div class="demo"><span class="tag">Demo-Steuerung</span>' + demo + '</div>' : '') + '</div>';
}

function vSettle() {
  const g = grp(), sug = suggestions(g);
  const row = (p, btn) => '<div class="card"><div class="row"><span>' + esc(nm(p.from)) + ' → ' + esc(nm(p.to)) + '</span><span class="num">' + nf(p.amt) + '</span></div>' + btn + '</div>';
  const sugHtml = sug.map((p, i) => row(p, '<div class="btns"><button class="btn ' + (p.from === 'me' || p.to === 'me' ? 'pri' : '') + '" data-a="paid" data-i="' + i + '">' +
    (p.from === 'me' ? 'Als bezahlt markieren' : p.to === 'me' ? 'Eingang bestätigen' : 'Demo: bezahlt und bestätigt') + '</button></div>')).join('');
  const pend = g.pay.map(p => row(p, '<span class="small mut">Bezahlt markiert, wartet auf Bestätigung durch ' + esc(nm(p.to)) + '.</span><div class="btns"><button class="btn" data-a="payConfirm" data-id="' + p.id + '">Demo: ' + esc(nm(p.to)) + ' bestätigt</button></div>')).join('');
  return head('Ausgleichen', true) + '<div class="wrap">' +
    '<p class="mut">Die App schlägt die wenigsten Zahlungen vor, mit denen alle wieder bei 0 stehen. Bezahlt wird außerhalb der App. Der Saldo ändert sich erst, wenn der Empfänger bestätigt.</p>' +
    (pend ? '<h2>Wartet auf Bestätigung</h2>' + pend : '') +
    '<h2>Vorgeschlagene Zahlungen</h2>' + (sugHtml || '<div class="card"><span class="pos title">Alles ausgeglichen</span><span class="small mut">' + (pend ? 'Es stehen nur noch Bestätigungen aus.' : 'Alle Salden stehen bei 0.') + '</span></div>') + '</div>';
}

const VIEWS = { home: vHome, newGroup: vNewGroup, group: vGroup, newBet: vNewBet, bet: vBet, settle: vSettle };
function render() {
  const c = cur();
  if ((c.g && !grp()) || (c.b && !bet())) { ui.nav = [{ v: 'home' }]; }
  document.getElementById('app').innerHTML = VIEWS[cur().v]();
}
function go(v, g, b) { ui.nav.push({ v, g, b }); window.scrollTo(0, 0); }

/* ---------- Aktionen ---------- */
const A = {
  go(d) { if (d.v === 'bet') ui.join = { o: null, s: '' }; go(d.v, d.g, d.b); },
  back() { if (ui.nav.length > 1) ui.nav.pop(); },
  reset() { db = seed(); ui.nav = [{ v: 'home' }]; toast('Beispieldaten zurückgesetzt.'); },
  tab(d) { ui.tab = d.t; },
  filter(d) { ui.filter = d.f; },
  createGroup() {
    const n = ui.gdraft.name.trim();
    if (!n) return toast('Gib der Gruppe einen Namen.');
    const g = { id: uid(), name: n, desc: ui.gdraft.desc.trim(), code: n.replace(/[^A-Za-z]/g, '').slice(0, 4).toUpperCase().padEnd(4, 'X') + '-' + Math.floor(1000 + Math.random() * 9000), admin: 'me', members: ['me'], bal: { me: 0 }, ledger: [], pay: [], bets: [] };
    db.groups.push(g); ui.gdraft = { name: '', desc: '' }; ui.nav.pop(); ui.tab = 'mem'; go('group', g.id);
    toast('Gruppe erstellt. Wetten sind ab 2 Mitgliedern möglich.');
  },
  addMember() {
    const g = grp(), n = POOL.find(x => !g.members.includes(x.toLowerCase()));
    if (!n) return toast('Keine weiteren Beispiel-Mitglieder.');
    const id = n.toLowerCase(); db.users[id] = n; g.members.push(id); g.bal[id] = 0; toast(n + ' ist beigetreten.');
  },
  copy() {
    const t = grp().code;
    try { navigator.clipboard.writeText(t).then(() => toast('Code kopiert.'), () => toast('Code: ' + t)); } catch (e) { toast('Code: ' + t); }
    return false;
  },
  newBet() {
    ui.draft = { type: 'real', name: '', desc: '', o1: 'Ja', o2: 'Nein', min: 10, max: 100, deadline: localInput(new Date(Date.now() + 72 * 3600e3)), ev: 0, side: 0, stake: 10 };
    go('newBet', cur().g);
  },
  type(d) { ui.draft.type = d.t; ui.draft.side = 0; },
  dside(d) { ui.draft.side = +d.i; },
  createBet() {
    const d = ui.draft, g = grp(), min = Math.floor(+d.min), max = Math.floor(+d.max), stake = Math.floor(+d.stake);
    if (g.members.length < 2) return toast('Wetten sind erst ab 2 Mitgliedern möglich.');
    if (!d.name.trim()) return toast('Gib der Wette einen Namen.');
    if (!(min >= 1) || !(max >= min)) return toast('Prüfe Mindest- und Höchsteinsatz.');
    if (!(stake >= min && stake <= max)) return toast('Dein Einsatz muss zwischen ' + min + ' und ' + max + ' liegen.');
    const b = { id: uid(), type: d.type, name: d.name.trim(), desc: d.desc.trim(), min, max, creator: 'me', status: 'open', entries: [{ u: 'me', o: d.side, s: stake }] };
    if (d.type === 'event') { const e = EVENTS[+d.ev]; b.opts = e.opts.slice(); b.event = e.name + ' · ' + e.when; }
    else {
      if (!d.o1.trim() || !d.o2.trim() || d.o1.trim() === d.o2.trim()) return toast('Gib zwei unterschiedliche Ausgänge an.');
      if (!d.deadline || isNaN(new Date(d.deadline))) return toast('Lege eine Deadline fest.');
      b.opts = [d.o1.trim(), d.o2.trim()]; b.deadline = new Date(d.deadline).toISOString();
    }
    g.bets.push(b); ui.nav.pop(); ui.tab = 'bets'; ui.filter = 'all'; go('bet', g.id, b.id);
    toast('Wette ist offen. Die Gruppe wird benachrichtigt.');
  },
  pick(d) { ui.join.o = +d.i; },
  join() {
    const b = bet(), s = Math.floor(+ui.join.s);
    if (ui.join.o == null) return toast('Wähle zuerst eine Seite.');
    if (!(s >= b.min && s <= b.max)) return toast('Der Einsatz muss zwischen ' + b.min + ' und ' + b.max + ' liegen.');
    b.entries.push({ u: 'me', o: ui.join.o, s }); toast('Du bist dabei. Einsatz vorgemerkt.');
  },
  withdraw() { const b = bet(); b.entries = b.entries.filter(e => e.u !== 'me'); ui.join = { o: null, s: '' }; toast('Einsatz zurückgezogen.'); },
  cancel() { bet().status = 'void'; toast('Wette storniert. Keine Buchung.'); },
  demoJoin() {
    const g = grp(), b = bet(), u = g.members.find(x => x !== 'me' && !b.entries.some(e => e.u === x));
    if (!u) return toast('Alle Mitglieder sind schon dabei.');
    const counts = b.opts.map((o, i) => b.entries.filter(e => e.o === i).length), o = counts.indexOf(Math.min.apply(null, counts));
    b.entries.push({ u, o, s: Math.min(b.max, Math.max(b.min, 20)) }); toast(nm(u) + ' setzt auf „' + b.opts[o] + '“.');
  },
  lock() { lock(bet()); },
  propose(d) { const b = bet(); b.proposed = +d.i; b.status = 'resolving'; toast('Ergebnis gemeldet. Wartet auf Bestätigung.'); },
  confirm() { const b = bet(); resolve(grp(), b, b.proposed); },
  dispute() { bet().status = 'disputed'; toast('Einspruch eingelegt. Die Gruppe stimmt ab.'); },
  result(d) { resolve(grp(), bet(), +d.i); },
  nomajority() { bet().status = 'void'; toast('Keine Mehrheit. Wette ungültig, keine Buchung.'); },
  paid(d) {
    const g = grp(), p = suggestions(g)[+d.i]; if (!p) return;
    const pay = { id: uid(), from: p.from, to: p.to, amt: p.amt };
    if (p.from === 'me') { g.pay.push(pay); toast('Als bezahlt markiert. ' + nm(p.to) + ' muss bestätigen.'); }
    else { g.pay.push(pay); A.payConfirm({ id: pay.id }); }
  },
  payConfirm(d) {
    const g = grp(), i = g.pay.findIndex(p => p.id === d.id); if (i < 0) return;
    const p = g.pay.splice(i, 1)[0], dl = {}; dl[p.from] = p.amt; dl[p.to] = -p.amt;
    g.bal[p.from] += p.amt; g.bal[p.to] -= p.amt;
    g.ledger.push({ t: 'Ausgleich: ' + nm(p.from) + ' an ' + nm(p.to), d: dl }); toast('Zahlung bestätigt. Salden aktualisiert.');
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  const r = fn(el.dataset);
  save(); if (r !== false) render();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.d) ui.draft[t.dataset.d] = t.value;
  else if (t.dataset.gd) ui.gdraft[t.dataset.gd] = t.value;
  else if (t.dataset.j) ui.join[t.dataset.j] = t.value;
});
document.addEventListener('change', e => { if (e.target.dataset.d === 'ev') { ui.draft.ev = +e.target.value; ui.draft.side = 0; render(); } });
render();
</script>
</body>
</html>
