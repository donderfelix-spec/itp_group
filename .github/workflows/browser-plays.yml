# The browser plays in real Chromium, S-220: game/tests/test_play_*.py and
# the six other test files that drive Chromium (named in PLAYS below).
# Separate from ci.yml and never run on pull requests, so a slow or flaky
# play never blocks a merge: it runs after each merge to main and by hand.
name: Browser plays

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plays:
    # Ubuntu 24.04 like our own machines, so the fonts below are the same
    # packages (S-231).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      # The tests find Playwright with `require('playwright')` through
      # NODE_PATH = `npm root -g` (node_environment in
      # tests/test_play_campus_detail.py), so it is installed globally.
      - name: Install Playwright and Chromium
        run: |
          npm install -g playwright@1.63.0
          playwright install --with-deps chromium
      # The game ships no font: the page and the canvas ask for "system-ui,
      # sans-serif". Pinned pixels (the room-name boxes in test_map_polish,
      # the minigame layouts) were measured with Inter, the font our machines
      # use for those names; the runner's own default is DejaVu Sans, which is
      # wider (S-231). So the runner gets Inter and our setting, and the step
      # stops here if system-ui is not Inter. DejaVu Sans stays installed:
      # test_play_minigames_wide_font checks the minigames with it on purpose.
      - name: Install the fonts of our machines
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-inter fonts-dejavu-core
          sudo cp tests/fonts/56-prefer-inter.conf /etc/fonts/conf.d/
          sudo fc-cache -f
          fc-match system-ui
          test "$(fc-match -f '%{family[0]}' system-ui)" = Inter
          test "$(fc-match -f '%{family[0]}' sans-serif)" = Inter
      # Without a working Chromium every play would be skipped and the run
      # would be green for nothing: stop here instead.
      - name: Check that Chromium starts
        run: NODE_PATH="$(npm root -g)" node -e "require('playwright').chromium.launch().then((b) => b.close())"
      # A few plays fail now and then on a busy machine (for example
      # test_play_campus_felix_mix, the key walking in test_play_hiding,
      # test_play_emergency_button_centre, test_play_walking_diagnostic).
      # So the failed tests alone run once more with --last-failed (pytest's
      # own cache, no new dependency); the job is red only if they fail again.
      - name: Browser plays
        env:
          # Every test file that drives Chromium. A new one that is not
          # called test_play_*.py must be added here (S-224).
          PLAYS: >-
            tests/test_play_*.py
            tests/test_classic_soft_wall_shadow.py
            tests/test_emergency_button_art.py
            tests/test_hanna_floors_and_shrubs.py
            tests/test_hiding_objects.py
            tests/test_lobby_mode_buttons.py
            tests/test_map_polish.py
        run: |
          python -m pytest $PLAYS -rs \
            || python -m pytest $PLAYS --last-failed -rs
