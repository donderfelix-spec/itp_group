# The browser plays (game/tests/test_play_*.py) in real Chromium, S-220.
# Separate from ci.yml and never run on pull requests, so a slow or flaky
# play never blocks a merge: it runs after each merge to main and by hand.
name: Browser plays

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plays:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      # The tests find Playwright with `require('playwright')` through
      # NODE_PATH = `npm root -g` (node_environment in
      # tests/test_play_campus_detail.py), so it is installed globally.
      - name: Install Playwright and Chromium
        run: |
          npm install -g playwright@1.63.0
          playwright install --with-deps chromium
      # Without a working Chromium every play would be skipped and the run
      # would be green for nothing: stop here instead.
      - name: Check that Chromium starts
        run: NODE_PATH="$(npm root -g)" node -e "require('playwright').chromium.launch().then((b) => b.close())"
      # A few plays fail now and then on a busy machine (for example
      # test_play_campus_felix_mix, the key walking in test_play_hiding,
      # test_play_emergency_button_centre, test_play_walking_diagnostic).
      # So the failed tests alone run once more with --last-failed (pytest's
      # own cache, no new dependency); the job is red only if they fail again.
      - name: Browser plays
        run: |
          python -m pytest tests/test_play_*.py -rs \
            || python -m pytest tests/test_play_*.py --last-failed -rs
