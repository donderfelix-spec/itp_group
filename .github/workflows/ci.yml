name: CI

on:
  pull_request:
  push:
    branches: [main]

# The jobs only read the repository (S-224).
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The archived prototype "We Be(a)t" (S-45) keeps its own checks.
      - name: Syntax check
        run: |
          for f in archive/prototype/js/*.js archive/tests/*.js; do
            node --check "$f"
          done
      - name: Flow tests
        run: node archive/tests/run.js

  game:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Syntax check of the client
        run: |
          for f in $(find client -name '*.js'); do
            node --check "$f"
          done
