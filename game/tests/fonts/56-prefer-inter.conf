<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The font setting of the machines our browser plays were measured on
     (S-225): system-ui and sans-serif are Inter (Ubuntu 24.04, package
     fonts-inter). .github/workflows/browser-plays.yml copies this file to
     /etc/fonts/conf.d/ on the GitHub runner. Its name must sort after
     49-sansserif.conf and before 58-dejavu-lgc-sans.conf and 60-latin.conf,
     the first files that prefer another font for sans-serif. -->
<fontconfig>
  <alias><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>ui-sans-serif</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
</fontconfig>
