<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 668" font-family="system-ui, sans-serif">
  <title>Group Project – campus map draft 2</title>
  <defs>
    <pattern id="paving" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#F3F0E9"/>
      <path d="M24 0V24H0" fill="none" stroke="#E1DBCD" stroke-width="1.5"/>
    </pattern>
    <g id="tree">
      <rect x="-14" y="-14" width="28" height="28" rx="3" fill="#D9D2C2" stroke="#2E2A3B" stroke-width="2"/>
      <circle r="9" fill="#5FA86B" stroke="#2E2A3B" stroke-width="2"/>
    </g>
    <g id="col"><circle r="7" fill="#FFFFFF" stroke="#2E2A3B" stroke-width="2.5"/></g>
  </defs>

  <rect width="680" height="668" fill="#DCE6C8"/>
  <rect x="0" y="566" width="680" height="18" fill="#F0DFA8"/>
  <rect x="0" y="584" width="680" height="30" fill="#4FA3D9"/>
  <path d="M0 596 q17 -7 34 0 t34 0 t34 0 t34 0 t34 0 t34 0 t34 0 t34 0 t34 0 t34 0 t34 0 t34 0 t34 0 t34 0 t34 0 t34 0 t34 0 t34 0 t34 0 t34 0" fill="none" stroke="#DDF0FA" stroke-width="2"/>
  <rect x="0" y="614" width="680" height="54" fill="#F4EFE3"/>

  <!-- Main Deck -->
  <path d="M20 170 H660 V400 H440 V566 H160 V230 H20 Z" fill="url(#paving)" stroke="#2E2A3B" stroke-width="4" stroke-linejoin="round"/>
  <rect x="300" y="262" width="130" height="56" rx="4" fill="#9CD3E6" stroke="#2E2A3B" stroke-width="2.5"/>
  <path d="M312 282 h40 M366 300 h48" stroke="#DDF0FA" stroke-width="2" stroke-linecap="round"/>
  <use href="#tree" x="212" y="252"/><use href="#tree" x="212" y="344"/>
  <use href="#tree" x="542" y="252"/><use href="#tree" x="542" y="344"/>
  <use href="#tree" x="200" y="440"/><use href="#tree" x="400" y="440"/>
  <g transform="translate(-6,0)" fill="none" stroke="#2E2A3B" stroke-width="8.5" stroke-linecap="butt">
    <path d="M239 502 V468 L263 502 V468" stroke-linejoin="bevel"/>
    <circle cx="290" cy="477.5" r="10.5"/>
    <path d="M275 499 H305" stroke-width="6.5"/>
    <path d="M311 468 L326 496 L341 468" stroke-linejoin="miter"/>
    <path d="M343 502 L358 474 L373 502" stroke-linejoin="miter"/>
  </g>
  <text x="486" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#2E2A3B">Main Deck</text>
  <text x="300" y="556" text-anchor="middle" font-size="11" fill="#2E2A3B">view of the beach</text>

  <!-- glass front to the beach -->
  <rect x="166" y="561" width="268" height="10" rx="2" fill="#8FD0EC" stroke="#2E2A3B" stroke-width="2"/>
  <path d="M190 569 l7 -6 M204 569 l7 -6 M292 569 l7 -6 M306 569 l7 -6 M392 569 l7 -6 M406 569 l7 -6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <path d="M255 561 v10 M345 561 v10" stroke="#2E2A3B" stroke-width="2"/>

  <!-- Lecture Hall -->
  <rect x="20" y="20" width="210" height="150" fill="#EAD3AE" stroke="#2E2A3B" stroke-width="4"/>
  <rect x="60" y="30" width="110" height="8" fill="#2E2A3B"/>
  <g fill="#FFFFFF" stroke="#2E2A3B" stroke-width="2">
    <rect x="40" y="60" width="170" height="9" rx="3"/><rect x="40" y="81" width="170" height="9" rx="3"/>
    <rect x="40" y="102" width="170" height="9" rx="3"/><rect x="40" y="123" width="170" height="9" rx="3"/>
  </g>
  <text x="125" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#2E2A3B">Lecture Hall</text>

  <!-- Mon Café (Hovione Atrium) -->
  <rect x="250" y="20" width="200" height="150" fill="#F6ECE0" stroke="#2E2A3B" stroke-width="4"/>
  <rect x="268" y="30" width="92" height="14" rx="3" fill="#B98A5E" stroke="#2E2A3B" stroke-width="2.5"/>
  <rect x="388" y="29" width="40" height="18" rx="3" fill="#5E6472" stroke="#2E2A3B" stroke-width="2.5"/><circle cx="400" cy="38" r="3" fill="#F2695C"/><circle cx="416" cy="38" r="3" fill="#FFD23F"/>
  <use href="#col" x="285" y="82"/><use href="#col" x="415" y="82"/>
  <use href="#col" x="285" y="132"/><use href="#col" x="415" y="132"/>
  <circle cx="350" cy="104" r="7" fill="#D9A85F" stroke="#2E2A3B" stroke-width="2"/>
  <circle cx="318" cy="66" r="7" fill="#D9A85F" stroke="#2E2A3B" stroke-width="2"/>
  <circle cx="382" cy="126" r="7" fill="#D9A85F" stroke="#2E2A3B" stroke-width="2"/>
  <text x="350" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#2E2A3B">Mon Café</text>

  <!-- Canteen -->
  <rect x="470" y="20" width="190" height="150" fill="#D7EDDF" stroke="#2E2A3B" stroke-width="4"/>
  <rect x="485" y="30" width="135" height="14" rx="3" fill="#7FBF9A" stroke="#2E2A3B" stroke-width="2.5"/>
  <g fill="#FFFFFF" stroke="#2E2A3B" stroke-width="2.5">
    <rect x="492" y="66" width="24" height="24" rx="3"/><rect x="553" y="66" width="24" height="24" rx="3"/><rect x="614" y="80" width="24" height="24" rx="3"/>
    <rect x="492" y="108" width="24" height="24" rx="3"/><rect x="553" y="108" width="24" height="24" rx="3"/>
  </g>
  <text x="565" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#2E2A3B">Canteen</text>

  <!-- CTT Student Hall (tall) -->
  <rect x="20" y="230" width="140" height="330" fill="#D6E4F4" stroke="#2E2A3B" stroke-width="4"/>
  <text x="90" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#2E2A3B">CTT Student Hall</text>
  <g fill="#8DB4E8" stroke="#2E2A3B" stroke-width="2">
    <rect x="40" y="264" width="92" height="13" rx="3"/><rect x="40" y="296" width="92" height="13" rx="3"/>
    <rect x="40" y="328" width="92" height="13" rx="3"/><rect x="40" y="360" width="92" height="13" rx="3"/>
    <rect x="40" y="392" width="92" height="13" rx="3"/><rect x="40" y="424" width="92" height="13" rx="3"/>
    <rect x="40" y="456" width="92" height="13" rx="3"/><rect x="40" y="488" width="92" height="13" rx="3"/>
  </g>
  <rect x="34" y="540" width="112" height="9" rx="2" fill="#5C7FB8"/>

  <!-- Pingo Doce -->
  <rect x="440" y="400" width="220" height="160" fill="#DCEFC8" stroke="#2E2A3B" stroke-width="4"/>
  <g fill="#7DB55A" stroke="#2E2A3B" stroke-width="2">
    <rect x="466" y="440" width="16" height="56" rx="3"/><rect x="516" y="440" width="16" height="56" rx="3"/>
    <rect x="566" y="440" width="16" height="56" rx="3"/><rect x="616" y="440" width="16" height="56" rx="3"/>
  </g>
  <rect x="456" y="528" width="56" height="13" rx="3" fill="#2E2A3B"/>
  <text x="614" y="424" text-anchor="middle" font-size="13" font-weight="700" fill="#2E2A3B">Pingo Doce</text>

  <!-- doors -->
  <g fill="#F3F0E9">
    <rect x="105" y="165" width="40" height="10"/><rect x="330" y="165" width="40" height="10"/><rect x="545" y="165" width="40" height="10"/>
    <rect x="70" y="225" width="40" height="10"/><rect x="520" y="395" width="40" height="10"/>
  </g>

  <!-- hiding spots -->
  <rect x="566" y="236" width="58" height="26" rx="8" fill="#5FA86B" stroke="#2E2A3B" stroke-width="2.5"/>
  <g fill="#FFFFFF" fill-opacity="0.55" stroke="#2E2A3B" stroke-width="2" stroke-dasharray="4 3">
    <circle cx="595" cy="249" r="9"/><circle cx="549" cy="468" r="9"/><circle cx="136" cy="524" r="9"/><circle cx="636" cy="128" r="9"/>
  </g>

  <circle cx="642" cy="249" r="11" fill="#F2695C" stroke="#2E2A3B" stroke-width="2.5"/>

  <!-- task stations -->
  <g font-size="11" font-weight="700" fill="#2E2A3B" text-anchor="middle">
    <circle cx="196" cy="46" r="10" fill="#FFD23F" stroke="#2E2A3B" stroke-width="2.5"/><text x="196" y="50">1</text>
    <circle cx="436" cy="62" r="10" fill="#FFD23F" stroke="#2E2A3B" stroke-width="2.5"/><text x="436" y="66">2</text>
    <circle cx="640" cy="48" r="10" fill="#FFD23F" stroke="#2E2A3B" stroke-width="2.5"/><text x="640" y="52">3</text>
    <circle cx="90" cy="520" r="10" fill="#FFD23F" stroke="#2E2A3B" stroke-width="2.5"/><text x="90" y="524">4</text>
    <circle cx="532" cy="534" r="10" fill="#FFD23F" stroke="#2E2A3B" stroke-width="2.5"/><text x="532" y="538">5</text>
    <circle cx="300" cy="534" r="10" fill="#FFD23F" stroke="#2E2A3B" stroke-width="2.5"/><text x="300" y="538">6</text>
  </g>

  <text x="340" y="636" text-anchor="middle" font-size="11" fill="#2E2A3B">1 Sort the slides · 2 Brew the order · 3 Build the tray · 4 Shelve the books · 5 Self-checkout · 6 Catch the wave</text>
  <text x="340" y="654" text-anchor="middle" font-size="12" fill="#2E2A3B">Red button: emergency meeting · Dashed circles: hiding spots · Light blue bar: glass front</text>
</svg>
